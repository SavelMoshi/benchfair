name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14', '3.15']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Run documented examples
        run: |
          python -m benchfair examples/players.json --courts 2 --rounds 8 --seed 42 > schedule.md
          python -m benchfair examples/players.json --courts 2 --rounds 8 --seed 42 --format json > schedule.json
          python -m json.tool schedule.json > /dev/null
          diff examples/schedule.md schedule.md
          diff examples/schedule.json schedule.json
      - name: Verify installed command
        run: |
          python -m pip install .
          benchfair examples/players.json --courts 2 --rounds 8 --seed 42 --format json > installed.json
          diff schedule.json installed.json
